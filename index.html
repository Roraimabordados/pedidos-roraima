<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos de bordado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cover:#1B2E25;
    --cover-dark:#101C16;
    --paper:#FBF8F1;
    --card:#FFFFFF;
    --line:#E1DAC6;
    --ink:#2B2620;
    --ink-soft:#7A7060;
    --gold:#D4AF7A;
    --gold-light:#F2E6CE;
    --bronze:#A67C52;
    --bronze-dark:#7A5B3B;
    --income:#2F6B4F;
    --income-bg:#E7F1EA;
    --late:#A23E3E;
    --late-bg:#FBEBEA;
    --ready:#8C5A2C;
    --ready-bg:#F5E9DA;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app{
    font-family:'IBM Plex Sans',sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--cover) 0%, var(--cover-dark) 100%);
    min-height:100vh;
    padding:24px 14px 60px;
  }
  .brand-header{
    max-width:820px; margin:0 auto 14px; display:flex; align-items:center;
    justify-content:center;
  }
  .brand-logo{height:110px; width:auto; max-width:90%;}
  .book{
    max-width:820px;
    margin:0 auto;
    background:var(--paper);
    border-radius:14px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .book-header{
    padding:20px 26px 16px;
    border-bottom:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .book-title{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0;
  }
  .save-status{font-size:11px; color:var(--ink-soft); letter-spacing:.03em;}

  .alerts{padding:16px 26px 0;}
  .alert-box{
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:10px;
    font-size:13px;
  }
  .alert-box b{font-weight:600; display:block; margin-bottom:4px; font-size:13px;}
  .alert-box.late{background:var(--late-bg); color:var(--late); border:1.5px solid var(--late);}
  .alert-box.ready{background:var(--ready-bg); color:var(--ready); border:1.5px solid var(--ready);}
  .alert-list{margin:4px 0 0; padding-left:18px;}
  .alert-list li{margin-bottom:3px;}
  .alerts-empty{padding:10px 0 0; font-size:12px; color:var(--ink-soft); font-style:italic;}

  .tabs{display:flex; border-bottom:2px solid var(--ink); margin-top:16px;}
  .tab-btn{
    flex:1; padding:13px; background:var(--gold-light); border:none;
    border-right:1px solid var(--line); font-size:14px; font-weight:500;
    color:var(--ink-soft); cursor:pointer;
  }
  .tab-btn:last-child{border-right:none;}
  .tab-btn.active{background:var(--paper); color:var(--ink);}
  .tab-panel{display:none; padding:18px 24px 26px;}
  .tab-panel.active{display:block;}

  .form-card{
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:var(--radius);
    padding:16px; margin-bottom:20px;
  }
  .form-title{font-size:13px; font-weight:600; margin:0 0 10px; color:var(--bronze-dark); text-transform:uppercase; letter-spacing:.04em;}
  .form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .form-grid .full{grid-column:1/-1;}
  .form-grid label{display:block; font-size:11px; color:var(--bronze-dark); font-weight:500; margin-bottom:4px;}
  .form-grid input, .form-grid select, .form-grid textarea{
    width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:13px;
    padding:8px 10px; border:1px solid #DDC9AE; border-radius:6px;
    background:#FEFCF8; color:var(--ink); outline:none; resize:vertical;
  }
  .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus{
    border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,122,.25);
  }
  .checks-row{display:flex; gap:18px; grid-column:1/-1; padding-top:2px; flex-wrap:wrap;}
  .check-inline{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink);}
  .check-inline input{width:16px; height:16px; accent-color:var(--gold);}
  .btn-add{
    margin-top:12px; font-size:13px; font-weight:500; padding:9px 18px;
    border:none; border-radius:6px; background:var(--cover); color:#FAFAF8; cursor:pointer;
  }
  .btn-add:hover{background:var(--gold); color:var(--cover);}
  .form-error{font-size:12px; color:var(--late); margin-top:6px; display:none;}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  .toolbar label{font-size:12px; color:var(--ink-soft);}
  .toolbar select{font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff;}

  .order-card{
    background:var(--card); border:1px solid var(--line); border-left:5px solid var(--line);
    border-radius:8px; padding:14px 16px; margin-bottom:12px;
  }
  .order-card.is-late{border-left-color:var(--late); background:var(--late-bg);}
  .order-card.is-ready{border-left-color:var(--ready); background:var(--ready-bg);}
  .order-top{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .order-client{font-weight:600; font-size:15px;}
  .order-client a{color:var(--ink-soft); font-weight:400; font-size:12px; text-decoration:none; margin-left:8px;}
  .order-recibo{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);}
  .order-dates{font-size:12px; color:var(--ink-soft); margin-bottom:10px; line-height:1.6;}
  .order-dates .late-tag{color:var(--late); font-weight:600;}
  .inline-date{
    font-family:'IBM Plex Sans',sans-serif; font-size:12px; color:var(--ink-soft);
    border:1px solid transparent; border-radius:4px; padding:2px 4px; background:transparent;
  }
  .inline-date:hover, .inline-date:focus{border-color:var(--line); background:#fff; outline:none;}
  .badges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .badge{font-size:10px; padding:3px 8px; border-radius:20px; font-weight:500; letter-spacing:.02em; border:1px solid var(--line); color:var(--ink-soft);}
  .badge.prio-alta{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .badge.prio-media{background:var(--gold-light); color:var(--gold); border-color:var(--gold);}
  .badge.prio-baja{background:transparent;}
  .badge.pay-pending{background:var(--late-bg); color:var(--late); border-color:var(--late);}
  .badge.pay-ok{background:var(--income-bg); color:var(--income); border-color:var(--income);}
  .badge.pay-partial{background:var(--ready-bg); color:var(--ready); border-color:var(--ready);}
  .badge.design-pending{background:var(--ready-bg); color:var(--ready); border-color:var(--ready);}
  .order-work{font-size:12.5px; color:var(--ink); margin-bottom:10px; line-height:1.5;}
  .order-work .work-label{color:var(--ink-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:2px;}
  .order-work + .order-work{margin-top:-4px;}

  .order-actions{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    border-top:1px dashed var(--line); padding-top:12px;
  }
  .field-group{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
  .field-group select{
    font-size:13px; padding:7px 9px; border:1.5px solid var(--gold); border-radius:6px;
    background:#fff; color:var(--ink); font-weight:500;
  }
  .action-check{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500;}
  .action-check input{width:18px; height:18px; cursor:pointer; accent-color:var(--income);}
  .received-field{display:flex; align-items:center; gap:6px; font-size:13px;}
  .received-field input{
    width:100px; font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:right;
    padding:6px 8px; border:1px solid var(--line); border-radius:6px; color:var(--income); font-weight:500;
  }
  .del-btn{margin-left:auto; background:none; border:1px solid var(--line); border-radius:6px; color:var(--ink-soft); cursor:pointer; font-size:14px; padding:5px 9px;}
  .del-btn:hover{color:var(--late); border-color:var(--late);}
  .empty-msg{padding:30px 10px; text-align:center; color:var(--ink-soft); font-size:13px; font-family:'Fraunces',serif; font-style:italic;}

  .edit-form{padding-top:10px;}
  .edit-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .edit-grid .full{grid-column:1/-1;}
  .edit-grid label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px;}
  .edit-grid input, .edit-grid select, .edit-grid textarea{
    width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:13px;
    padding:8px 10px; border:1px solid var(--line); border-radius:6px;
    background:#fff; color:var(--ink); outline:none; resize:vertical;
  }
  .edit-grid input:focus, .edit-grid select:focus, .edit-grid textarea:focus{border-color:var(--gold);}
  .edit-actions{display:flex; gap:10px; margin-top:12px;}
  .btn-cancel{
    font-size:13px; font-weight:500; padding:9px 16px; border:1px solid var(--line);
    border-radius:6px; background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .btn-cancel:hover{border-color:var(--late); color:var(--late);}

  .history-log{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);}
  .history-log-list{list-style:none; margin:0; padding:0; font-size:12px; color:var(--ink-soft);}
  .history-log-list li{padding:5px 0; border-bottom:1px solid var(--line);}
  .history-log-list li:last-child{border-bottom:none;}
  .hl-date{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--gold); margin-bottom:2px;}

  .hist-filter{display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .hist-filter select, .hist-filter input{font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:6px;}
  .hist-row{
    display:grid; grid-template-columns:1fr 90px 110px 100px 90px; gap:10px; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .hist-undo{
    background:none; border:1px solid var(--line); border-radius:6px; color:var(--ink-soft);
    cursor:pointer; font-size:11.5px; padding:5px 8px;
  }
  .hist-undo:hover{color:var(--late); border-color:var(--late);}
  .hist-head{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); border-bottom:2px solid var(--ink); padding-bottom:6px;}
  .hist-amount{font-family:'IBM Plex Mono',monospace; text-align:right; color:var(--income); font-weight:500;}
  .hist-total{
    display:flex; justify-content:space-between; align-items:center; margin-top:14px;
    padding:14px 16px; background:var(--income-bg); border-radius:8px;
  }
  .hist-total-label{font-size:13px; color:var(--income); font-weight:500;}
  .hist-total-value{font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--income); font-weight:600;}

  .capacity-panel{padding:16px 26px 0;}
  .capacity-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .capacity-title{font-size:13px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:0;}
  .capacity-goal{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
  .capacity-goal input{
    width:60px; font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:center;
    padding:5px 6px; border:1px solid var(--line); border-radius:6px;
  }
  .capacity-list{display:flex; flex-direction:column; gap:6px; margin-bottom:6px;}
  .capacity-row{
    display:grid; grid-template-columns:110px 1fr 70px; align-items:center; gap:10px;
    padding:7px 10px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; background:var(--card);
  }
  .capacity-row.full{border-color:var(--late); background:var(--late-bg);}
  .capacity-row.near{border-color:var(--ready); background:var(--ready-bg);}
  .capacity-row .cap-date{font-weight:500;}
  .capacity-bar{height:7px; border-radius:4px; background:var(--line); overflow:hidden; position:relative;}
  .capacity-bar-fill{height:100%; background:var(--income); transition:width .25s ease;}
  .capacity-row.near .capacity-bar-fill{background:var(--ready);}
  .capacity-row.full .capacity-bar-fill{background:var(--late);}
  .capacity-bar-preview{
    position:absolute; top:0; height:100%; background:var(--gold);
    transition:width .2s ease, left .2s ease; animation:capacityPulse 1.1s ease-in-out infinite;
  }
  @keyframes capacityPulse{0%,100%{opacity:.65;} 50%{opacity:1;}}
  .cap-preview-tag{color:var(--bronze-dark); font-weight:600; font-size:11px;}
  .capacity-row .cap-count{text-align:right; font-family:'IBM Plex Mono',monospace;}
  .capacity-hint{font-size:12px; margin-top:4px; padding:6px 8px; border-radius:6px;}
  .capacity-hint.ok{color:var(--income); background:var(--income-bg);}
  .capacity-hint.near{color:var(--ready); background:var(--ready-bg);}
  .capacity-hint.full{color:var(--late); background:var(--late-bg);}

  #accessGate{
    position:fixed; inset:0; background:linear-gradient(180deg,var(--cover) 0%, var(--cover-dark) 100%);
    display:flex; align-items:center; justify-content:center; z-index:9999; padding:20px;
  }
  .gate-box{
    background:var(--paper); border-radius:14px; padding:32px 28px; text-align:center;
    max-width:320px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .gate-title{font-family:'Fraunces',serif; font-weight:600; font-size:22px; letter-spacing:.08em; margin:0; color:var(--ink);}
  .gate-sub{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin:4px 0 20px;}
  .gate-box input{
    width:100%; font-size:14px; padding:10px 12px; border:1px solid #DDC9AE; border-radius:6px;
    margin-bottom:12px; outline:none; box-sizing:border-box;
  }
  .gate-box input:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,122,.25);}
  .gate-box button{
    width:100%; padding:10px; border:none; border-radius:6px; background:var(--cover);
    color:#FAFAF8; font-size:14px; font-weight:500; cursor:pointer;
  }
  .gate-box button:hover{background:var(--gold); color:var(--cover);}
  .gate-error{display:none; color:var(--late); font-size:12px; margin-top:10px;}

  .header-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .backup-btn{
    font-size:11px; padding:6px 10px; border:1px solid var(--line); border-radius:6px;
    background:#fff; color:var(--bronze-dark); cursor:pointer; white-space:nowrap;
  }
  .backup-btn:hover{border-color:var(--gold); color:var(--ink);}
  .restore-confirm{margin:0 26px 10px; padding:10px 14px; background:var(--ready-bg); border:1px solid var(--ready); border-radius:8px; font-size:13px; color:var(--ready);}
  .restore-confirm button{margin-left:10px; font-size:12px; padding:5px 10px; border-radius:6px; border:1px solid var(--ready); background:#fff; color:var(--ready); cursor:pointer;}

  @media (max-width:560px){
    .gate-box{padding:26px 20px;}
    .capacity-row{grid-template-columns:80px 1fr 55px; font-size:11.5px;}
    .capacity-panel{padding:14px 14px 0;}
    .form-grid{grid-template-columns:1fr;}
    .hist-row{grid-template-columns:1fr 70px 90px 70px 70px; font-size:11.5px;}
    .book-header{padding:18px 16px 14px;}
    .tab-panel{padding:14px 14px 20px;}
    .order-actions{gap:10px;}
    .del-btn{margin-left:0;}
  }
</style>
</head>

<script>
// --- Compatibilidad: si se abre fuera de Claude.ai (ej. GitHub Pages),
// window.storage no existe. Creamos una versión que guarda en este navegador. ---
if(!window.storage){
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem('roraima:' + key);
      if(v === null) throw new Error('not found');
      return {key, value: v};
    },
    set: async (key, value) => {
      localStorage.setItem('roraima:' + key, value);
      return {key, value};
    },
    delete: async (key) => {
      localStorage.removeItem('roraima:' + key);
      return {key, deleted: true};
    },
    list: async (prefix) => {
      const pre = 'roraima:' + (prefix || '');
      const keys = Object.keys(localStorage).filter(k => k.startsWith(pre)).map(k => k.slice(9));
      return {keys};
    }
  };
}

// --- Candado simple de acceso (cambia la contraseña aquí) ---
const APP_PASSWORD = 'roraima2026';
(function accessGate(){
  if(sessionStorage.getItem('roraima-unlocked') === 'yes') return;
  document.getElementById('app').style.display = 'none';
  const gate = document.createElement('div');
  gate.id = 'accessGate';
  gate.innerHTML = `
    <div class="gate-box">
      <p class="gate-title">RORAIMA</p>
      <p class="gate-sub">Acceso interno</p>
      <input type="password" id="gatePass" placeholder="Contraseña" autofocus />
      <button id="gateBtn">Entrar</button>
      <p class="gate-error" id="gateError">Contraseña incorrecta.</p>
    </div>`;
  document.body.appendChild(gate);
  function tryUnlock(){
    if(document.getElementById('gatePass').value === APP_PASSWORD){
      sessionStorage.setItem('roraima-unlocked', 'yes');
      gate.remove();
      document.getElementById('app').style.display = '';
    }else{
      document.getElementById('gateError').style.display = 'block';
    }
  }
  document.getElementById('gateBtn').addEventListener('click', tryUnlock);
  document.getElementById('gatePass').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
})();

let pedidos = [];
let editingId = null;
let metaDiaria = 60;
const openHistoryIds = new Set();
const ESTADO_LABEL = {diseno:'En diseño', proceso:'En proceso', listo:'Bordado listo'};

function fmt(n){
  const num = Number(n) || 0;
  return '$' + num.toLocaleString('es-CO', {maximumFractionDigits:0});
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function setStatus(msg){ document.getElementById('saveStatus').textContent = msg; }
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
function uid(){ return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,8); }

const FIELD_LABELS = {
  cliente:'Cliente', celular:'Celular', recibo:'Número de recibo', prioridad:'Prioridad',
  fechaCreacion:'Fecha de recepción', fechaPromesa:'Fecha de promesa', monto:'Valor del pedido',
  cantidad:'Cantidad de prendas', colorHilos:'Color de hilos', descripcion:'Descripción del trabajo',
  crearDiseno:'Crear diseño', yaTieneDiseno:'Ya tiene diseño',
  estado:'Estado del pedido', estadoPago:'Estado de pago', montoAbonado:'Monto abonado'
};
function logChange(p, texto){
  if(!p.historialCambios) p.historialCambios = [];
  p.historialCambios.push({fecha: new Date().toISOString(), texto});
}
function fmtFechaHora(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('es-CO', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}

// --- Respaldo en Google Sheets ---
// Pega aquí el link que te da Google al "Implementar" el Apps Script (paso 3 de las instrucciones).
// Mientras esté vacío, la app funciona igual pero sin enviar copia a Sheets.
const BACKUP_SHEET_URL = 'https://script.google.com/macros/s/AKfycbw6FkrMFVCJls0ICQiQ0dOIZVJnDL9cMiLxWnkjQ02C217mrqUryX_sPg03FnjDgZaxLw/exec';

async function syncToSheet(){
  if(!BACKUP_SHEET_URL) return;
  try{
    await fetch(BACKUP_SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({pedidos, metaDiaria, sincronizadoEl: new Date().toISOString()})
    });
  }catch(e){
    console.error('No se pudo enviar el respaldo a Sheets', e);
  }
}

async function savePedidos(){
  try{
    await window.storage.set('pedidos', JSON.stringify(pedidos));
    setStatus('Guardado');
  }catch(e){
    setStatus('Error al guardar');
    console.error(e);
  }
  syncToSheet();
}
async function saveMetaDiaria(val){
  try{ await window.storage.set('meta-diaria', String(val)); }catch(e){ console.error(e); }
}
async function loadAll(){
  try{
    const p = await window.storage.get('pedidos');
    pedidos = p ? JSON.parse(p.value) : [];
  }catch(e){ pedidos = []; }
  try{
    const m = await window.storage.get('meta-diaria');
    metaDiaria = m ? (parseInt(m.value) || 60) : 60;
  }catch(e){ metaDiaria = 60; }
  document.getElementById('metaDiaria').value = metaDiaria;
  document.getElementById('sheetStatus').textContent = BACKUP_SHEET_URL ? '☁ Respaldo en Sheets activo' : '☁ Respaldo en Sheets no configurado';
  render();
  setStatus('Guardado');
}

function isLate(p){
  return !p.entregado && p.fechaPromesa && p.fechaPromesa < todayStr();
}
function isReadyWaiting(p){
  return !p.entregado && p.estado === 'listo';
}
function daysLate(p){
  const a = new Date(p.fechaPromesa), b = new Date(todayStr());
  return Math.max(0, Math.round((b - a) / 86400000));
}
function restante(p){
  return Math.max(0, (Number(p.monto)||0) - (Number(p.montoAbonado)||0));
}
function paymentBadge(p){
  if(p.estadoPago === 'completo') return `<span class="badge pay-ok">Total cancelado</span>`;
  if(p.estadoPago === 'abona') return `<span class="badge pay-partial">Abona ${fmt(p.montoAbonado)} &middot; resta ${fmt(restante(p))}</span>`;
  return `<span class="badge pay-pending">Pago pendiente</span>`;
}
function cargaPorFecha(fecha, excludeId){
  return pedidos
    .filter(p => p.fechaPromesa === fecha && p.id !== excludeId)
    .reduce((s,p) => s + (Number(p.cantidad)||0), 0);
}
function nextAvailableDate(fromDateStr, cantidadExtra){
  let d = new Date(fromDateStr + 'T00:00:00');
  for(let i=0; i<60; i++){
    const ds = d.toISOString().slice(0,10);
    if(cargaPorFecha(ds) + (Number(cantidadExtra)||0) <= metaDiaria) return ds;
    d.setDate(d.getDate() + 1);
  }
  return null;
}
function renderCapacityPanel(previewDate, previewCantidad){
  previewCantidad = previewCantidad || 0;
  const list = document.getElementById('capacityList');
  const today = todayStr();
  const dateSet = new Set(pedidos.filter(p => !p.entregado && p.fechaPromesa && p.fechaPromesa >= today).map(p => p.fechaPromesa));
  if(previewDate && previewDate >= today) dateSet.add(previewDate);
  const dates = [...dateSet].sort();
  if(dates.length === 0){
    list.innerHTML = '<div class="empty-msg" style="padding:12px 0;">Todavía no hay pedidos programados para próximas fechas.</div>';
    return;
  }
  list.innerHTML = dates.slice(0, 14).map(ds => {
    const carga = cargaPorFecha(ds);
    const extra = (ds === previewDate) ? previewCantidad : 0;
    const total = carga + extra;
    const basePct = Math.min(100, Math.round((carga / metaDiaria) * 100));
    const totalPct = Math.min(100, Math.round((total / metaDiaria) * 100));
    const extraPct = Math.max(0, totalPct - basePct);
    let cls = '';
    if(total >= metaDiaria) cls = 'full';
    else if(total >= metaDiaria * 0.8) cls = 'near';
    const previewTag = extra > 0 ? ` <span class="cap-preview-tag">+${extra} nuevo</span>` : '';
    return `<div class="capacity-row ${cls}">
      <span class="cap-date">${ds}${previewTag}</span>
      <span class="capacity-bar">
        <span class="capacity-bar-fill" style="width:${basePct}%"></span>
        ${extra > 0 ? `<span class="capacity-bar-preview" style="width:${extraPct}%; left:${basePct}%;"></span>` : ''}
      </span>
      <span class="cap-count">${total}/${metaDiaria}</span>
    </div>`;
  }).join('');
}
function updatePromesaHint(){
  const hint = document.getElementById('fPromesaHint');
  const fecha = document.getElementById('fPromesa').value;
  const cantidad = parseInt(document.getElementById('fCantidad').value) || 0;
  renderCapacityPanel(fecha, cantidad);
  if(!fecha){ hint.style.display = 'none'; return; }
  const cargaActual = cargaPorFecha(fecha);
  const total = cargaActual + cantidad;
  hint.style.display = 'block';
  if(total > metaDiaria){
    const libre = nextAvailableDate(fecha, cantidad);
    hint.className = 'capacity-hint full';
    hint.textContent = `Esa fecha ya suma ${cargaActual}/${metaDiaria}. Con este pedido pasarías a ${total}. ${libre ? 'Próxima fecha disponible: ' + libre : 'Revisa varias fechas más adelante.'}`;
  }else if(total >= metaDiaria * 0.8){
    hint.className = 'capacity-hint near';
    hint.textContent = `Esa fecha va en ${cargaActual}/${metaDiaria}. Con este pedido quedaría en ${total}/${metaDiaria}, cerca del límite.`;
  }else{
    hint.className = 'capacity-hint ok';
    hint.textContent = `Esa fecha va en ${cargaActual}/${metaDiaria}. Con este pedido quedaría en ${total}/${metaDiaria}.`;
  }
}

function renderAlerts(){
  const box = document.getElementById('alertsBox');
  const late = pedidos.filter(isLate);
  const ready = pedidos.filter(p => isReadyWaiting(p) && !isLate(p));
  let html = '';
  if(late.length){
    html += `<div class="alert-box late"><b>Retrasados (${late.length}) &mdash; contactar o priorizar</b>
      <ul class="alert-list">${late.map(p => `<li>${escapeHtml(p.cliente)} &mdash; recibo ${escapeHtml(p.recibo||'-')}, ${daysLate(p)} día(s) de atraso</li>`).join('')}</ul>
    </div>`;
  }
  if(ready.length){
    html += `<div class="alert-box ready"><b>Listos, sin retirar (${ready.length}) &mdash; avisar al cliente</b>
      <ul class="alert-list">${ready.map(p => `<li>${escapeHtml(p.cliente)} ${p.celular ? '('+escapeHtml(p.celular)+')' : ''} &mdash; recibo ${escapeHtml(p.recibo||'-')}</li>`).join('')}</ul>
    </div>`;
  }
  if(!html){
    html = '<div class="alerts-empty">Sin avisos por ahora: no hay pedidos retrasados ni listos sin retirar.</div>';
  }
  box.innerHTML = html;
}

function sortPedidos(list){
  const mode = document.getElementById('sortMode').value;
  const prioVal = {alta:0, media:1, baja:2};
  const arr = [...list];
  if(mode === 'prioridad'){
    arr.sort((a,b) => (prioVal[a.prioridad]-prioVal[b.prioridad]) || (a.fechaPromesa||'').localeCompare(b.fechaPromesa||''));
  }else{
    arr.sort((a,b) => (a.fechaPromesa||'').localeCompare(b.fechaPromesa||''));
  }
  return arr;
}

function renderEditForm(p){
  return `
    <div class="edit-form">
      <div class="edit-grid">
        <div><label>Cliente</label><input class="edit-input" data-field="cliente" value="${escapeHtml(p.cliente)}" /></div>
        <div><label>Celular</label><input class="edit-input" data-field="celular" value="${escapeHtml(p.celular||'')}" /></div>
        <div><label>Número de recibo</label><input class="edit-input" data-field="recibo" value="${escapeHtml(p.recibo||'')}" /></div>
        <div><label>Prioridad</label>
          <select class="edit-input" data-field="prioridad">
            <option value="alta" ${p.prioridad==='alta'?'selected':''}>Alta</option>
            <option value="media" ${p.prioridad==='media'?'selected':''}>Media</option>

          </select>

        <div><label>Fecha de recepción</label><input type="date" class="edit-input" data-field="fechaCreacion" value="${p.fechaCreacion||''}" /></div>
        <div><label>Fecha de promesa</label><input type="date" class="edit-input" data-field="fechaPromesa" value="${p.fechaPromesa||''}" /></div>
        <div><label>Valor del pedido</label><input type="number" step="0.01" class="edit-input" data-field="monto" value="${p.monto||0}" /></div>
        <div><label>Cantidad de prendas</label><input type="number" min="1" step="1" class="edit-input" data-field="cantidad" value="${p.cantidad||1}" /></div>
        <div><label>Color de hilos</label><input class="edit-input" data-field="colorHilos" value="${escapeHtml(p.colorHilos||'')}" /></div>
        <div class="full"><label>Descripción del trabajo</label><textarea rows="2" class="edit-input" data-field="descripcion">${escapeHtml(p.descripcion||'')}</textarea></div>
        <div class="checks-row">
          <label class="check-inline"><input type="checkbox" class="edit-input edit-crear-diseno" data-field="crearDiseno" ${p.crearDiseno?'checked':''} /> Crear diseño</label>
          <label class="check-inline"><input type="checkbox" class="edit-input edit-ya-diseno" data-field="yaTieneDiseno" ${p.yaTieneDiseno?'checked':''} /> Ya tiene diseño</label>
        </div>
      </div>
      <div class="edit-actions">
        <button class="btn-add save-edit">Guardar cambios</button>
        <button class="btn-cancel cancel-edit">Cancelar</button>
      </div>

}
function renderHistoryLog(p){
  const entries = (p.historialCambios || []).slice().reverse();
  if(entries.length === 0) return '<div class="history-log"><p class="empty-msg" style="padding:10px 0;">Sin cambios registrados todavía.</p></div>';
  return `<div class="history-log"><ul class="history-log-list">
    ${entries.map(h => `<li><span class="hl-date">${fmtFechaHora(h.fecha)}</span>${escapeHtml(h.texto)}</li>`).join('')}
  </ul></div>`;
}

function renderActive(){

  const list = document.getElementById('ordersList');
  const activos = sortPedidos(pedidos.filter(p => !p.entregado));
  if(activos.length === 0){
    list.innerHTML = '<div class="empty-msg">No hay pedidos activos. Registra uno arriba.</div>';
    return;
  }
  list.innerHTML = activos.map(p => {
    const late = isLate(p);
    const ready = isReadyWaiting(p);
    let cardClass = 'order-card';
    if(late) cardClass += ' is-late';
    else if(ready) cardClass += ' is-ready';
    const badges = [];
    badges.push(`<span class="badge prio-${p.prioridad}">Prioridad ${p.prioridad}</span>`);
    badges.push(paymentBadge(p));
    if(p.crearDiseno) badges.push(`<span class="badge design-pending">Crear diseño</span>`);
    else if(p.yaTieneDiseno) badges.push(`<span class="badge pay-ok">Ya tiene diseño</span>`);

    if(editingId === p.id){
      return `<div class="${cardClass}" data-id="${p.id}">
        <div class="order-top">
          <div class="order-client">${escapeHtml(p.cliente)}</div>
          <div class="order-recibo">Recibo ${escapeHtml(p.recibo || '-')}</div>
        </div>
        ${renderEditForm(p)}
      </div>`;
    }

    return `
    <div class="${cardClass}" data-id="${p.id}">
      <div class="order-top">
        <div class="order-client">${escapeHtml(p.cliente)} ${p.celular ? `<a href="tel:${escapeHtml(p.celular)}">${escapeHtml(p.celular)}</a>` : ''}</div>
        <div class="order-recibo">Recibo ${escapeHtml(p.recibo || '-')}</div>
      </div>
      <div class="order-dates">
        Recibido: <input type="date" class="inline-date inp-fecha-creacion" value="${p.fechaCreacion || ''}" />
        &middot; Promesa: ${p.fechaPromesa || '-'} ${late ? `<span class="late-tag">&middot; retrasado ${daysLate(p)}d</span>` : ''}<br/>
        Entrega real: ${p.fechaEntregaReal || 'pendiente'} &middot; Valor: ${fmt(p.monto)} &middot; ${p.cantidad || 0} prenda(s)
      </div>
      ${p.descripcion ? `<div class="order-work"><span class="work-label">Trabajo</span>${escapeHtml(p.descripcion)}</div>` : ''}
      ${p.colorHilos ? `<div class="order-work"><span class="work-label">Color de hilos</span>${escapeHtml(p.colorHilos)}</div>` : ''}
      <div class="badges">${badges.join('')}</div>
      <div class="order-actions">
        <div class="field-group">
          <span>Estado</span>
          <select class="sel-estado">
            <option value="diseno" ${p.estado==='diseno'?'selected':''}>En diseño</option>
            <option value="proceso" ${p.estado==='proceso'?'selected':''}>En proceso</option>
            <option value="listo" ${p.estado==='listo'?'selected':''}>Bordado listo</option>
          </select>
        </div>
        <div class="field-group">
          <span>Pago</span>
          <select class="sel-estado-pago">
            <option value="pendiente" ${p.estadoPago==='pendiente'?'selected':''}>Pendiente</option>
            <option value="abona" ${p.estadoPago==='abona'?'selected':''}>Abona</option>
            <option value="completo" ${p.estadoPago==='completo'?'selected':''}>Total cancelado</option>
          </select>
        </div>
        ${p.estadoPago === 'abona' ? `
        <div class="received-field">
          <span>Abonado</span>
          <input type="number" step="0.01" class="inp-abonado" value="${p.montoAbonado || 0}" />
        </div>` : ''}
        <label class="action-check"><input type="checkbox" class="chk-deliver" ${p.entregado ? 'checked' : ''} /> Entregado</label>
        <button class="del-btn edit-pedido" title="Editar pedido">Editar</button>
        <button class="del-btn toggle-history" title="Ver historial de cambios">${openHistoryIds.has(p.id) ? 'Ocultar historial' : 'Historial'}</button>
        <button class="del-btn del-pedido" title="Eliminar pedido">Eliminar</button>
      </div>
      ${openHistoryIds.has(p.id) ? renderHistoryLog(p) : ''}
    </div>`;
  }).join('');
}

function renderHistory(){
  const mode = document.getElementById('histMode').value;
  let entregados = pedidos.filter(p => p.entregado);
  if(mode === 'dia'){
    const d = document.getElementById('histDia').value;
    if(d) entregados = entregados.filter(p => p.fechaEntregaReal === d);
  }else if(mode === 'mes'){
    const m = document.getElementById('histMes').value;
    if(m) entregados = entregados.filter(p => (p.fechaEntregaReal || '').slice(0,7) === m);
  }else if(mode === 'anio'){
    const y = document.getElementById('histAnio').value;
    if(y) entregados = entregados.filter(p => (p.fechaEntregaReal || '').slice(0,4) === String(y));
  }
  entregados.sort((a,b) => (b.fechaEntregaReal||'').localeCompare(a.fechaEntregaReal||''));
  const list = document.getElementById('historyList');
  if(entregados.length === 0){
    list.innerHTML = '<div class="empty-msg">No hay entregas en este período.</div>';
  }else{
    list.innerHTML = entregados.map(p => `
      <div class="hist-row" data-id="${p.id}">
        <span>${escapeHtml(p.cliente)}<br/><span style="color:var(--ink-soft); font-size:11px;">${p.cantidad || 0} prenda(s)</span></span>
        <span>${escapeHtml(p.recibo || '-')}</span>
        <span>${p.fechaEntregaReal || '-'}</span>
        <span class="hist-amount">${fmt(p.montoAbonado)}${restante(p) > 0 ? `<br/><span style="color:var(--late); font-weight:400; font-size:11px;">resta ${fmt(restante(p))}</span>` : ''}</span>
        <button class="hist-undo undo-pedido" title="Regresar a pedidos activos">Deshacer</button>
      </div>`).join('');
  }
  const total = entregados.reduce((s,p) => s + (Number(p.montoAbonado)||0), 0);
  const totalPrendas = entregados.reduce((s,p) => s + (Number(p.cantidad)||0), 0);
  document.getElementById('histTotal').textContent = fmt(total);
  document.getElementById('histTotalPrendas').textContent = totalPrendas;
}

function render(){
  renderAlerts();
  renderCapacityPanel();
  renderActive();
  renderHistory();
}

document.getElementById('addBtn').addEventListener('click', () => {
  const cliente = document.getElementById('fCliente').value.trim();
  const celular = document.getElementById('fCelular').value.trim();
  const recibo = document.getElementById('fRecibo').value.trim();
  const prioridad = document.getElementById('fPrioridad').value;
  const fechaCreacion = document.getElementById('fFechaCreacion').value || todayStr();
  const fechaPromesa = document.getElementById('fPromesa').value;
  const cantidad = parseInt(document.getElementById('fCantidad').value) || 0;
  const monto = parseFloat(document.getElementById('fMonto').value);
  const estado = document.getElementById('fEstado').value;
  const colorHilos = document.getElementById('fColorHilos').value.trim();
  const descripcion = document.getElementById('fDescripcion').value.trim();
  const crearDiseno = document.getElementById('fCrearDiseno').checked;
  const yaTieneDiseno = document.getElementById('fYaTieneDiseno').checked;
  const estadoPago = document.getElementById('fEstadoPago').value;
  let montoAbonado = 0;
  if(estadoPago === 'completo') montoAbonado = monto;
  else if(estadoPago === 'abona') montoAbonado = parseFloat(document.getElementById('fMontoAbonado').value) || 0;
  const err = document.getElementById('formError');
  if(!cliente || isNaN(monto) || !fechaPromesa || cantidad < 1){
    err.textContent = 'Completa cliente, monto, fecha de promesa y cantidad de prendas (mínimo 1).';
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  const nuevoPedido = {
    id: uid(), cliente, celular, recibo, prioridad, fechaCreacion, fechaPromesa, monto, cantidad,
    estado, colorHilos, descripcion, crearDiseno, yaTieneDiseno, estadoPago, montoAbonado,
    entregado:false, fechaEntregaReal:null, historialCambios:[]
  };
  logChange(nuevoPedido, `Pedido registrado: cliente ${cliente}, ${cantidad} prenda(s), valor ${fmt(monto)}, promesa ${fechaPromesa}, estado ${ESTADO_LABEL[estado]}.`);
  pedidos.unshift(nuevoPedido);
  ['fCliente','fCelular','fRecibo','fMonto','fPromesa','fCantidad','fColorHilos','fDescripcion','fMontoAbonado'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fCrearDiseno').checked = false;
  document.getElementById('fYaTieneDiseno').checked = false;
  document.getElementById('fPrioridad').value = 'media';
  document.getElementById('fEstado').value = 'diseno';
  document.getElementById('fEstadoPago').value = 'pendiente';
  document.getElementById('fAbonoWrap').style.display = 'none';
  document.getElementById('fFechaCreacion').value = todayStr();
  document.getElementById('fPromesaHint').style.display = 'none';
  render();
  savePedidos();
});

document.getElementById('fPromesa').addEventListener('input', updatePromesaHint);
document.getElementById('fCantidad').addEventListener('input', updatePromesaHint);
document.getElementById('metaDiaria').addEventListener('input', (e) => {
  metaDiaria = parseInt(e.target.value) || 60;
  renderCapacityPanel();
  updatePromesaHint();
  saveMetaDiaria(metaDiaria);
});

document.getElementById('fCrearDiseno').addEventListener('change', (e) => {
  if(e.target.checked) document.getElementById('fYaTieneDiseno').checked = false;
});
document.getElementById('fYaTieneDiseno').addEventListener('change', (e) => {
  if(e.target.checked) document.getElementById('fCrearDiseno').checked = false;
});
document.getElementById('fEstadoPago').addEventListener('change', (e) => {
  document.getElementById('fAbonoWrap').style.display = e.target.value === 'abona' ? 'block' : 'none';
});

document.getElementById('ordersList').addEventListener('click', (e) => {
  const card = e.target.closest('.order-card');
  if(!card) return;
  const id = card.dataset.id;
  if(e.target.classList.contains('del-pedido')){
    pedidos = pedidos.filter(p => p.id !== id);
    render();
    savePedidos();
  }
  if(e.target.classList.contains('edit-pedido')){
    editingId = id;
    renderActive();
  }
  if(e.target.classList.contains('cancel-edit')){
    editingId = null;
    renderActive();
  }
  if(e.target.classList.contains('save-edit')){
    const p = pedidos.find(x => x.id === id);
    if(!p) return;
    const cambios = [];
    card.querySelectorAll('.edit-input').forEach(inp => {
      const field = inp.dataset.field;
      let nuevo = inp.type === 'checkbox' ? inp.checked : inp.value;
      if(inp.tagName === 'TEXTAREA') nuevo = inp.value.trim();
      if(inp.type === 'text' || (inp.tagName === 'INPUT' && inp.type !== 'checkbox' && inp.type !== 'number' && inp.type !== 'date')) nuevo = inp.value.trim();
      if(inp.type === 'number') nuevo = parseFloat(inp.value) || 0;
      const anterior = p[field];
      if(String(anterior) !== String(nuevo)){
        const label = FIELD_LABELS[field] || field;
        const fmtVal = (v) => (typeof v === 'boolean') ? (v ? 'Sí' : 'No') : (v === '' || v === null || v === undefined ? '-' : v);
        cambios.push(`${label}: "${fmtVal(anterior)}" → "${fmtVal(nuevo)}"`);
      }
      p[field] = nuevo;
    });
    if(p.crearDiseno) p.yaTieneDiseno = false;
    if(cambios.length){
      cambios.forEach(c => logChange(p, c));
    }
    editingId = null;
    render();
    savePedidos();
  }
  if(e.target.classList.contains('toggle-history')){
    if(openHistoryIds.has(id)) openHistoryIds.delete(id);
    else openHistoryIds.add(id);
    renderActive();
  }
});
document.getElementById('ordersList').addEventListener('change', (e) => {
  const card = e.target.closest('.order-card');
  if(!card) return;
  const p = pedidos.find(x => x.id === card.dataset.id);
  if(!p) return;
  if(e.target.classList.contains('edit-crear-diseno') && e.target.checked){
    card.querySelector('.edit-ya-diseno').checked = false;
  }
  if(e.target.classList.contains('edit-ya-diseno') && e.target.checked){
    card.querySelector('.edit-crear-diseno').checked = false;
  }
  if(e.target.classList.contains('sel-estado')){
    const antes = ESTADO_LABEL[p.estado];
    p.estado = e.target.value;
    logChange(p, `Estado del pedido: "${antes}" → "${ESTADO_LABEL[p.estado]}"`);
    render(); savePedidos();
  }
  if(e.target.classList.contains('sel-estado-pago')){
    const antes = p.estadoPago;
    p.estadoPago = e.target.value;
    if(p.estadoPago === 'completo') p.montoAbonado = p.monto;
    if(p.estadoPago === 'pendiente') p.montoAbonado = 0;
    logChange(p, `Estado de pago: "${antes}" → "${p.estadoPago}"`);
    render(); savePedidos();
  }
  if(e.target.classList.contains('inp-abonado')){
    const antes = p.montoAbonado || 0;
    p.montoAbonado = parseFloat(e.target.value) || 0;
    if(antes !== p.montoAbonado) logChange(p, `Monto abonado: ${fmt(antes)} → ${fmt(p.montoAbonado)}`);
    render(); savePedidos();
  }
  if(e.target.classList.contains('inp-fecha-creacion')){
    const antes = p.fechaCreacion;
    p.fechaCreacion = e.target.value;
    if(antes !== p.fechaCreacion) logChange(p, `Fecha de recepción: "${antes||'-'}" → "${p.fechaCreacion||'-'}"`);
    savePedidos();
  }
  if(e.target.classList.contains('chk-deliver')){
    p.entregado = e.target.checked;
    if(p.entregado){
      p.fechaEntregaReal = todayStr();
      logChange(p, `Marcado como entregado el ${p.fechaEntregaReal}.`);
    }else{
      p.fechaEntregaReal = null;
      logChange(p, `Se revirtió la entrega (deshacer).`);
    }
    render(); savePedidos();
  }
});

document.getElementById('sortMode').addEventListener('change', renderActive);

document.getElementById('historyList').addEventListener('click', (e) => {
  const row = e.target.closest('.hist-row');
  if(!row || !row.dataset.id) return;
  if(e.target.classList.contains('undo-pedido')){
    const p = pedidos.find(x => x.id === row.dataset.id);
    if(!p) return;
    p.entregado = false;
    p.fechaEntregaReal = null;
    render();
    savePedidos();
  }
});

document.getElementById('histMode').addEventListener('change', (e) => {
  document.getElementById('histDia').style.display = e.target.value === 'dia' ? 'inline-block' : 'none';
  document.getElementById('histMes').style.display = e.target.value === 'mes' ? 'inline-block' : 'none';
  document.getElementById('histAnio').style.display = e.target.value === 'anio' ? 'inline-block' : 'none';
  renderHistory();
});
document.getElementById('histDia').addEventListener('input', renderHistory);
document.getElementById('histMes').addEventListener('input', renderHistory);
document.getElementById('histAnio').addEventListener('input', renderHistory);

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('downloadBackupBtn').addEventListener('click', () => {
  const data = {pedidos, metaDiaria, exportadoEl: new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `roraima-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

let pendingRestore = null;
document.getElementById('restoreFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.pedidos)) throw new Error('formato inválido');
      pendingRestore = data;
      const box = document.getElementById('restoreConfirm');
      box.style.display = 'block';
      box.innerHTML = `Se encontraron ${data.pedidos.length} pedido(s) en el archivo.
        Esto reemplazará todos los pedidos actuales.
        <button id="confirmRestoreBtn">Confirmar restauración</button>
        <button id="cancelRestoreBtn">Cancelar</button>`;
      document.getElementById('confirmRestoreBtn').addEventListener('click', async () => {
        pedidos = pendingRestore.pedidos || [];
        metaDiaria = pendingRestore.metaDiaria || 60;
        document.getElementById('metaDiaria').value = metaDiaria;
        await savePedidos();
        await saveMetaDiaria(metaDiaria);
        render();
        setStatus('Copia restaurada');
        box.style.display = 'none';
        document.getElementById('restoreFile').value = '';
      });
      document.getElementById('cancelRestoreBtn').addEventListener('click', () => {
        box.style.display = 'none';
        document.getElementById('restoreFile').value = '';
      });
    }catch(err){
      const box = document.getElementById('restoreConfirm');
      box.style.display = 'block';
      box.innerHTML = 'Ese archivo no es una copia de seguridad válida.';
      document.getElementById('restoreFile').value = '';
    }
  };
  reader.readAsText(file);
});

loadAll();
</script>
